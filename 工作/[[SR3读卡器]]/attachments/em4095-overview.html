<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>EM4095 解码总览</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--dim:#666;--line:#d0d0d0;--s:#f5f5f5}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#c9d1d9;--dim:#8b949e;--line:#30363d;--s:#161b22}}
body{font:14px/1.5 "Segoe UI","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:20px;margin:0}
.wrap{overflow-x:auto}
h2{font-size:1.1em;font-weight:600;color:var(--dim);margin:0 0 10px}
</style>
<body>
<h2>EM4095 解码总览 — 从 GTIM 边沿到 reader_app 事件</h2>
<div class=wrap>
<svg viewBox="0 0 1060 340" width="1060" height="340" style="max-width:100%">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0L7,3L0,6Z" fill="#8b949e"/></marker>
    <marker id="ao" markerWidth="7" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0L7,3L0,6Z" fill="#f0883e"/></marker>
    <linearGradient id="gn" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fafafa"/><stop offset="100%" stop-color="#f0f0f0"/></linearGradient>
    <linearGradient id="gd" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#21262d"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
  </defs>

  <!-- ====== ZONES ====== -->
  <rect x="8" y="8" width="1044" height="50" rx="6" fill="var(--s)" stroke="var(--line)"/>
  <text x="20" y="26" font-size="10" font-weight="600" fill="#8b949e">BSP</text>
  <rect x="8" y="66" width="1044" height="144" rx="6" fill="var(--s)" stroke="var(--line)"/>
  <text x="20" y="84" font-size="10" font-weight="600" fill="#58a6ff">MIDWARE / em4095.c</text>
  <rect x="8" y="218" width="1044" height="114" rx="6" fill="var(--s)" stroke="var(--line)"/>
  <text x="20" y="236" font-size="10" font-weight="600" fill="#f0883e">APP / reader_app.c</text>

  <!-- ====== BSP ROW ====== -->
  <rect x="24" y="30" width="90" height="22" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="69" y="45" text-anchor="middle" font-size="11" fill="#c9d1d9">GTIM ISR</text>
  <line x1="114" y1="41" x2="140" y2="41" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="142" y="30" width="94" height="22" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="189" y="45" text-anchor="middle" font-size="11" fill="#c9d1d9">GTIM FIFO</text>
  <line x1="236" y1="41" x2="262" y2="41" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ====== MIDWARE: Enter → Classify → Dispatch ====== -->
  <rect x="264" y="28" width="124" height="44" rx="7" fill="#0d1525" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="326" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#58a6ff">EM4095_Poll</text>
  <text x="326" y="62" text-anchor="middle" font-size="9" fill="#8b949e">while 消费 FIFO → classify → dispatch</text>
  <line x1="388" y1="50" x2="410" y2="50" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ====== THREE STATE MACHINE ====== -->
  <rect x="16" y="78" width="1028" height="124" rx="6" fill="none" stroke="var(--line)"/>
  <text x="26" y="96" font-size="9" font-weight="600" fill="#8b949e">三态状态机</text>

  <!-- Idle -->
  <rect x="36" y="104" width="120" height="62" rx="8" fill="#1a100c" stroke="#f0883e" stroke-width="1.8"/>
  <text x="96" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#f0883e">Idle</text>
  <text x="96" y="144" text-anchor="middle" font-size="9" fill="#8b949e">idle_process</text>
  <text x="96" y="158" text-anchor="middle" font-size="9" fill="#8b949e">等 LONG+↓ 触发</text>

  <!-- Seek -->
  <rect x="190" y="104" width="144" height="62" rx="8" fill="#0c150c" stroke="#3fb950" stroke-width="1.8"/>
  <text x="262" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#3fb950">SeekPreamble</text>
  <text x="262" y="144" text-anchor="middle" font-size="9" fill="#8b949e">seek_process · 交替SHORT计数</text>
  <text x="262" y="158" text-anchor="middle" font-size="9" fill="#8b949e">≥16→测base→转Receive</text>

  <!-- Receive -->
  <rect x="370" y="98" width="220" height="84" rx="8" fill="#0c131d" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="480" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#58a6ff">Receive</text>
  <text x="480" y="136" text-anchor="middle" font-size="9" fill="#8b949e">SHORT skip=0→解码bit | skip=1→边界跳过</text>
  <text x="480" y="150" text-anchor="middle" font-size="9" fill="#8b949e">LONG→解码bit | ↓=1 ↑=0 | edge_ring记录</text>
  <text x="480" y="164" text-anchor="middle" font-size="9" fill="#8b949e">Debris/Ambig err≥3→Idle | TIMEOUT→Idle</text>
  <text x="480" y="176" text-anchor="middle" font-size="9" font-weight="700" fill="#58a6ff">bit_count≥64 → handle_frame</text>

  <!-- Arrows Idle←→Seek→Receive -->
  <line x1="156" y1="135" x2="188" y2="135" stroke="#3fb950" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="172" y="130" text-anchor="middle" font-size="7" font-weight="600" fill="#3fb950">LONG+↓</text>
  <line x1="334" y1="135" x2="368" y2="135" stroke="#3fb950" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="351" y="130" text-anchor="middle" font-size="7" font-weight="600" fill="#3fb950">≥16 SHORT</text>
  <!-- Seek → Idle fallback -->
  <line x1="262" y1="166" x2="262" y2="188" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="262" y1="188" x2="96" y2="188" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="179" y="184" text-anchor="middle" font-size="7" fill="#f85149">非SHORT / 方向重复</text>
  <!-- Receive → Idle fallback -->
  <line x1="480" y1="182" x2="480" y2="198" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="480" y1="198" x2="96" y2="198" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="288" y="194" text-anchor="middle" font-size="7" fill="#f85149">err≥3 / TIMEOUT / 校验失败→replay</text>

  <!-- ====== VERIFY → VOTE ====== -->
  <rect x="620" y="106" width="130" height="32" rx="6" fill="#110d18" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="685" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#bc8cff">handle_frame()</text>
  <line x1="590" y1="134" x2="618" y2="134" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="620" y="146" width="130" height="32" rx="6" fill="#141005" stroke="#d2991d" stroke-width="1.5"/>
  <text x="685" y="166" text-anchor="middle" font-size="11" font-weight="600" fill="#d2991d">verify_frame()</text>
  <line x1="685" y1="138" x2="685" y2="144" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>

  <rect x="620" y="186" width="130" height="32" rx="6" fill="#0c150c" stroke="#3fb950" stroke-width="1.5"/>
  <text x="685" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">vote_frame()</text>
  <line x1="685" y1="178" x2="685" y2="184" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Verify/vote fail path -->
  <path d="M620,162 L610,162 L610,202 L618,202" fill="none" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="596" y="180" text-anchor="middle" font-size="7" fill="#f85149">失败: replay→Idle</text>

  <!-- card_on -->
  <rect x="386" y="230" width="130" height="36" rx="7" fill="#0c150c" stroke="#3fb950" stroke-width="1.5"/>
  <text x="451" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">card_on(id) · CardIn</text>
  <text x="451" y="260" text-anchor="middle" font-size="9" fill="#8b949e">新卡→清投票+emit+更新跟踪</text>
  <path d="M685,218 L685,236 L518,236 L518,248" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- CardInUnconfirmed -->
  <rect x="540" y="234" width="136" height="26" rx="5" fill="#141005" stroke="#d2991d" stroke-width="1.3"/>
  <text x="608" y="250" text-anchor="middle" font-size="10" font-weight="600" fill="#d2991d">CardInUnconfirmed</text>

  <!-- CardOut -->
  <rect x="540" y="266" width="136" height="20" rx="5" fill="#120d18" stroke="#bc8cff" stroke-width="1"/>
  <text x="608" y="280" text-anchor="middle" font-size="10" font-weight="600" fill="#bc8cff">CardOut · 200ms</text>

  <!-- ====== Event FIFO ====== -->
  <rect x="696" y="234" width="108" height="60" rx="7" fill="#1a0808" stroke="#f85149" stroke-width="1.5"/>
  <text x="750" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#f85149">Event FIFO</text>
  <text x="750" y="274" text-anchor="middle" font-size="9" fill="#8b949e">SPSC · 8深度</text>
  <text x="750" y="286" text-anchor="middle" font-size="9" fill="#8b949e">3种事件</text>
  <line x1="516" y1="248" x2="694" y2="262" stroke="#8b949e" stroke-width="1"/>
  <line x1="676" y1="247" x2="694" y2="258" stroke="#8b949e" stroke-width="1"/>
  <line x1="676" y1="276" x2="694" y2="274" stroke="#8b949e" stroke-width="1"/>

  <!-- ====== APP ====== -->
  <rect x="24" y="282" width="160" height="32" rx="6" fill="#151008" stroke="#f0883e" stroke-width="1.5"/>
  <text x="104" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#f0883e">poll_em4095_events</text>
  <line x1="696" y1="264" x2="186" y2="298" stroke="#f0883e" stroke-width="1.2" marker-end="url(#ao)"/>

  <rect x="220" y="282" width="120" height="32" rx="6" fill="#151008" stroke="#f0883e" stroke-width="1.5"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#f0883e">card_in / card_out</text>
  <line x1="184" y1="298" x2="218" y2="298" stroke="#f0883e" stroke-width="1.2" marker-end="url(#ao)"/>

  <rect x="376" y="280" width="100" height="28" rx="5" fill="rgba(240,136,62,.06)" stroke="#f0883e" stroke-width=".8"/>
  <text x="426" y="298" text-anchor="middle" font-size="11" fill="#f0883e">send_card / fail</text>
  <line x1="340" y1="298" x2="374" y2="298" stroke="#f0883e" stroke-width="1.2" marker-end="url(#ao)"/>

  <!-- Legend -->
  <rect x="820" y="294" width="8" height="8" rx="2" fill="none" stroke="#3fb950" stroke-width="1.2"/>
  <text x="834" y="302" font-size="8" fill="#8b949e">正常流</text>
  <rect x="880" y="294" width="8" height="8" rx="2" fill="none" stroke="#f85149" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="894" y="302" font-size="8" fill="#8b949e">回退/失败</text>
</svg>
</div>
</body>
</html>
